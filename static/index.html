<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample Scanner</title>
<style>
* { box-sizing:border-box; }
body {
    font:17px Arial,sans-serif; background:#f3f5f8; color:#172334;
    max-width:850px; margin:20px auto; padding:0 14px;
}
.toolbar,.card {
    background:white; padding:20px; border-radius:12px; margin-bottom:18px;
}
.toolbar { position:sticky; top:0; z-index:5; box-shadow:0 2px 8px #0001; }
h1,h2 { margin-top:0; }
button,.button {
    display:inline-block; padding:13px 18px; margin:5px 5px 5px 0;
    border:0; border-radius:7px; font:inherit; cursor:pointer;
    text-decoration:none; text-align:center;
}
button { background:#1763c6; color:white; }
.button { background:#e6eefb; color:#174d94; }
button:disabled,.disabled { opacity:.5; cursor:default; }
.muted { color:#58677a; font-size:14px; line-height:1.5; }
.error { color:#b02020; }
.status { white-space:pre-wrap; overflow-wrap:anywhere; }
.preview { width:100%; height:auto; border:1px solid #d4dce5; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.field { width:100%; padding:11px; margin:6px 0; font:inherit;
         border:1px solid #aeb8c6; border-radius:6px; }
.field.bad { border:2px solid #dc2626; background:#fff1f2; }
.field[readonly] { background:#f1f3f6; }
.field::placeholder { color:#687587; opacity:1; }
.help { color:#b02020; font-size:13px; margin:0 0 8px; }
.confirm { display:block; padding:14px; margin:14px 0 5px; background:#eef4ff; }
.confirm input { width:22px; height:22px; vertical-align:middle; margin-right:8px; }
.card.confirmed { border:2px solid #278347; }
summary { cursor:pointer; padding:12px 0; }
.original { width:100%; height:auto; margin:10px 0; }
[hidden] { display:none!important; }
@media(max-width:600px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="toolbar">
    <h1>Sample Scanner</h1>
    <input id="photos" type="file"
        accept="image/jpeg,image/png,image/webp" multiple hidden>
    <button id="upload" type="button">Upload sample</button>
    <a id="download" class="button" hidden>Download current CSV</a>
    <label style="display:block;margin:12px 0;font-size:15px;">
    <input id="include-unreviewed" type="checkbox">
    Include unreviewed samples in CSV
</label>
<p id="queue" role="status" aria-live="polite"></p>
    <p id="status" class="status" role="status"></p>
    <p id="connection" class="muted error"></p>
    <p class="muted">
        Upload one tube at a time. Confirm finished cards with “All good”.
        Only confirmed tubes enter the CSV.
    </p>
</div>
<div id="waiting"></div>
<div id="cards"></div>

<script>
const $ = s => document.querySelector(s);
const STORAGE = "scanner-review-session";
const names = [
    ["sample_id","Sample ID"], ["date_sampled","Date Sampled"],
    ["date_received","Date Received"], ["machine","Machine"],
    ["component","Component"], ["serial_number","Serial Number"],
    ["reference_lube","Reference Lube"]
];
const cards = new Map();
let session = null, sessionId = null, bootId = null;
let uploading = false, refreshing = false, writes = 0, initialized = false;

function say(text,error=false) {
    $("#status").textContent=text;
    $("#status").classList.toggle("error",error);
}
async function api(url,options={}) {
    const response=await fetch(url,{...options,cache:"no-store"});
    const value=await response.json().catch(()=>({}));
    if (!response.ok) throw new Error(
        typeof value.detail==="string" ? value.detail :
        `Request failed (${response.status}).`);
    return value;
}
function post(value) {
    return {method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify(value)};
}
function today() {
    const d=new Date();
    return new Date(d.getTime()-d.getTimezoneOffset()*60000)
        .toISOString().slice(0,10);
}
function remember() {
    try {
        sessionStorage.setItem(STORAGE,JSON.stringify({
            boot:bootId, session:sessionId
        }));
    } catch (_) {}
}
function dateText(value) {
    return String(value || "").trim();
}

function validDate(value) {
    const m=value.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!m) return false;
    const d=new Date(Date.UTC(+m[3],+m[1]-1,+m[2]));
    return d.getUTCFullYear()===+m[3] &&
        d.getUTCMonth()===+m[1]-1 && d.getUTCDate()===+m[2];
}
function validReceived(value) {
    const m=value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return !!m && validDate(`${m[2]}/${m[3]}/${m[1]}`);
}
function required(c) {
    const keys=["sample_id","date_sampled","date_received","machine","component"];
    if(c.type.value==="small") keys.push("serial_number");
    if(c.type.value==="large") keys.push("reference_lube");
    return keys;
}
function values(c) {
    const result={};
    names.forEach(([key])=>result[key]=c.inputs[key].value.trim());
    result.serial_number=result.serial_number.toUpperCase();
    if(c.type.value==="small") result.reference_lube="";
    if(c.type.value==="large") result.serial_number="";
    return result;
}
function fieldStates(c) {
    const fields=values(c), needed=required(c);
    names.forEach(([key])=>{
        let error="";
        const unused=(key==="serial_number" && c.type.value==="large") ||
            (key==="reference_lube" && c.type.value==="small");
        c.inputs[key].readOnly=unused;
        if(!unused) {
            if(!fields[key] && needed.includes(key)) error="Check the label.";
            if(key==="date_sampled" && !fields[key])
                error="Check the date as written on the label.";
            if(key==="date_received" && !validReceived(fields[key]))
                error="Enter a valid received date.";
            if(key==="component" && c.type.value==="small" &&
               fields[key] && !/^[1-6] (GS|NGS)$/.test(fields[key]))
                error="Example: 4 GS";
        }
        c.inputs[key].classList.toggle("bad",!!error);
        c.inputs[key].setAttribute("aria-invalid",error?"true":"false");
        c.hints[key].textContent=error;
    });
    c.el.classList.toggle("confirmed",c.check.checked && !c.dirty && !c.saveError);
}
function renderBar() {
    $("#upload").disabled=uploading || !initialized;
    $("#upload").textContent=uploading?"Uploading photos…":"Upload sample";
    const blocked=writes>0 || [...cards.values()].some(c=>c.saveError);
    if(session) {
        const q=session.counts||{};
        $("#queue").textContent=
            `${q.queued||0} waiting · ${q.processing||0} processing · `+
            `${session.ready_count||0} need review · ${session.confirmed_count||0} confirmed`;
        const includeAll=$("#include-unreviewed").checked;
        const exportCount=includeAll
            ? session.saved_count
            : session.confirmed_count;
        $("#download").hidden=!exportCount;
        $("#download").classList.toggle("disabled",blocked);
        $("#download").setAttribute("aria-disabled",blocked?"true":"false");
        if(blocked) $("#download").removeAttribute("href");
        else $("#download").href=
            `/sessions/${session.id}/csv?include_unreviewed=${includeAll}`;
    }
}
function saveCard(c,confirmed) {
    clearTimeout(c.timer);
    const version=c.version;
    const payload={
        session_id:sessionId, label_type:c.type.value,
        confirmed, fields:values(c)
    };
    writes++;
    c.operations++;
    c.check.disabled=true;
    c.note.textContent="Saving…";
    renderBar();
    c.tail=c.tail.catch(()=>{}).then(async()=>{
        const result=await api(`/samples/${c.id}/review`,post(payload));
        c.saveError=false;
        c.retry.hidden=true;
        session=result.session;
        if(version===c.version) {
            c.dirty=false;
            c.serverConfirmed=confirmed;
            c.check.checked=confirmed;
            c.el.hidden=confirmed;
            c.note.textContent=confirmed?"Confirmed — included in CSV.":"Changes saved. Check All good when ready.";
        }
    }).catch(error=>{
        c.saveError=true;
        c.check.checked=false;
        c.retry.hidden=false;
        c.note.textContent="Could not save: "+error.message;
    }).finally(()=>{
        writes--;
        c.operations--;
        c.check.disabled=c.operations>0;
        fieldStates(c);
        renderBar();
    });
    return c.tail;
}
function edited(c) {
    const wasConfirmed=c.check.checked || c.serverConfirmed;
    c.version++;
    c.dirty=true;
    c.check.checked=false;
    c.serverConfirmed=false;
    c.el.classList.remove("confirmed");
    clearTimeout(c.timer);
    fieldStates(c);
    if(wasConfirmed) saveCard(c,false);
    else c.timer=setTimeout(()=>saveCard(c,false),600);
}
function addCard(job) {
    const review=job.review;
    if(review?.confirmed) {
        const existing=cards.get(job.record_id);
        if(existing && !existing.dirty && existing.operations===0) {
            existing.el.hidden=true;
        }
        return;
    }
    if(!review?.fields || cards.has(job.record_id)) return;
    const c={
        id:job.record_id, inputs:{}, hints:{}, version:0,
        dirty:false, saveError:false, operations:0,
        serverConfirmed:!!review.confirmed, tail:Promise.resolve(), timer:null
    };
    c.el=document.createElement("section");
    c.el.className="card";
    c.el.dataset.sequence=job.sequence;
    const title=document.createElement("h2");
    title.textContent=review.fields.sample_id
        ? `Sample ${review.fields.sample_id}` : "Sample needs review";
    c.el.append(title);

    if(review.evidence) {
        const link=document.createElement("a");
        link.href=`/samples/${c.id}/evidence`;
        link.target="_blank"; link.rel="noopener";
        const image=document.createElement("img");
        image.src=link.href; image.className="preview"; image.loading="lazy";
        image.alt="Combined label view assembled from original field crops";
        link.append(image); c.el.append(link);
        const caption=document.createElement("p");
        caption.className="muted";
        caption.textContent="Actual field crops from the uploaded photos. Tap to enlarge.";
        c.el.append(caption);
    }

    const originals=document.createElement("details");
    const summary=document.createElement("summary");
    summary.textContent="View original photos";
    originals.append(summary);
    for(let n=1;n<=(review.image_count||1);n++) {
        const image=document.createElement("img");
        image.src=`/samples/${c.id}/images/${n}`;
        image.className="original"; image.loading="lazy";
        image.alt=`Original label photo ${n}`;
        originals.append(image);
    }
    c.el.append(originals);

    const typeLabel=document.createElement("label");
    typeLabel.textContent="Label type";
    c.type=document.createElement("select");
    c.type.className="field";
    [["unknown","Check label type"],["small","Small"],["large","Large"]]
        .forEach(([value,text])=>{
            const option=document.createElement("option");
            option.value=value; option.textContent=text; c.type.append(option);
        });
    c.type.value=review.label_type||"unknown";
    typeLabel.append(c.type); c.el.append(typeLabel);
    const grid=document.createElement("div"); grid.className="grid";

    names.forEach(([key,text])=>{
        const wrap=document.createElement("label");
        wrap.append(document.createTextNode(text));
        const input=document.createElement("input");
        input.className="field";
        input.type=key==="date_received"?"date":"text";
        input.maxLength=key==="date_received"?10:200;
        let value=String(review.fields[key]||"");
        if(key==="serial_number") value=value.toUpperCase();
        if(key==="date_sampled") {
            value=dateText(value); input.placeholder="Date as written on label";
        }
        input.value=value;
        if(key==="serial_number") {
            input.autocapitalize="characters"; input.spellcheck=false;
        }
        const hint=document.createElement("p"); hint.className="help";
        input.oninput=()=>{
            if(key==="serial_number") {
                const a=input.selectionStart,b=input.selectionEnd;
                input.value=input.value.toUpperCase();
                if(a!==null && b!==null) input.setSelectionRange(a,b);
            }
            edited(c);
        };
        c.inputs[key]=input; c.hints[key]=hint;
        wrap.append(input,hint); grid.append(wrap);
    });
    c.el.append(grid);

    const label=document.createElement("label");
    label.className="confirm";
    c.check=document.createElement("input");
    c.check.type="checkbox"; c.check.checked=!!review.confirmed;
    label.append(c.check,document.createTextNode("All good — include in CSV"));
    c.note=document.createElement("p"); c.note.className="muted status";
    c.note.textContent=review.confirmed?"Confirmed — included in CSV.":"Check the images and fields, then select All good.";
    c.retry=document.createElement("button");
    c.retry.type="button"; c.retry.textContent="Retry saving changes"; c.retry.hidden=true;
    c.retry.onclick=()=>{ c.version++; saveCard(c,false); };

    c.check.onchange=()=>{
        if(c.check.checked) {
            c.inputs.date_sampled.value=dateText(c.inputs.date_sampled.value);
            c.inputs.serial_number.value=c.inputs.serial_number.value.toUpperCase();
            const fields=values(c);
            let error="";
            if(c.type.value==="unknown") error="Choose Small or Large.";
            else if(!validReceived(fields.date_received))
                error="Enter a valid Date Received.";
            else if(c.type.value==="small" && fields.component &&
                    !/^[1-6] (GS|NGS)$/.test(fields.component))
                error="Small-label Component must look like 4 GS.";
            if(error) {
                c.check.checked=false; c.note.textContent=error;
                fieldStates(c); return;
            }
            const missing=required(c).filter(key=>!fields[key]);
            if(missing.length && !confirm(
                "Some fields are blank. Confirm that these should stay blank?"
            )) { c.check.checked=false; return; }
        }
        c.version++; c.dirty=true;
        saveCard(c,c.check.checked);
    };
    c.type.onchange=()=>{
        if(c.type.value==="small") c.inputs.reference_lube.value="";
        if(c.type.value==="large") c.inputs.serial_number.value="";
        edited(c);
    };
    c.el.append(label,c.note,c.retry);
    cards.set(c.id,c);
    const next=[...$("#cards").children].find(
        element=>Number(element.dataset.sequence)>job.sequence);
    $("#cards").insertBefore(c.el,next||null);
    fieldStates(c);
}
function renderSession() {
    renderBar();
    $("#waiting").replaceChildren();
    if(!session) return;
    (session.jobs||[]).forEach(job=>{
        if(job.state==="done") { addCard(job); return; }
        const row=document.createElement("p");
        row.className="muted";
        row.textContent=`Upload ${job.record_id.slice(0,6)} — `+
            ({queued:"waiting",processing:"processing",error:"failed"}[job.state]||job.state);
        if(job.state==="error") {
            row.append(document.createTextNode(": "+(job.error||"Could not read")));
            const retry=document.createElement("button");
            retry.type="button"; retry.textContent="Retry reading";
            retry.onclick=async()=>{
                retry.disabled=true;
                try {
                    session=await api(`/sessions/${sessionId}/retry/${job.record_id}`,{method:"POST"});
                    renderSession();
                } catch(error) { say(error.message,true); retry.disabled=false; }
            };
            row.append(retry);
        }
        $("#waiting").append(row);
    });
}
async function refresh() {
    if(!sessionId || refreshing) return;
    refreshing=true;
    try {
        session=await api(`/sessions/${sessionId}`);
        $("#connection").textContent="";
        renderSession();
    } catch(error) {
        $("#connection").textContent="Connection interrupted. The Pi can keep processing. Reconnecting…";
    } finally { refreshing=false; }
}
async function ensureSession() {
    if(sessionId && !session) session=await api(`/sessions/${sessionId}`);
    if(session && !session.finished_at) return;
    session=await api("/sessions",post({
        name:"Samples "+new Date().toLocaleString()
    }));
    sessionId=session.id; remember(); renderSession();
}
$("#include-unreviewed").onchange=renderBar;

$("#upload").onclick=()=>{
    if(uploading || !initialized) return;
    $("#photos").value=""; $("#photos").click();
};
$("#photos").onchange=async()=>{
    const files=Array.from($("#photos").files);
    if(!files.length || uploading) return;
    if(files.length>8) return say("Maximum 8 photos of one tube.",true);
    for(const file of files) {
        if(!["image/jpeg","image/png","image/webp"].includes(file.type))
            return say("Use JPG, PNG, or WebP. On iPhone, use Camera → Formats → Most Compatible.",true);
        if(!file.size || file.size>10*1024*1024)
            return say("Each photo must be nonempty and 10 MB or smaller.",true);
    }
    uploading=true; renderBar(); say("Uploading…");
    try {
        await ensureSession();
        const form=new FormData();
        files.forEach(file=>form.append("files",file));
        form.append("session_id",sessionId);
        form.append("date_received",today());
        await api("/upload",{method:"POST",body:form});
        say("Queued. You can upload another tube.");
        await refresh();
    } catch(error) {
        say(error.message+"\nIf the connection failed, check the queue before uploading the same tube again.",true);
    } finally {
        uploading=false; $("#photos").value=""; renderBar();
    }
};
window.addEventListener("beforeunload",event=>{
    if(uploading || writes || [...cards.values()].some(c=>c.dirty)) {
        event.preventDefault(); event.returnValue="";
    }
});
async function initialize() {
    renderBar();
    try {
        const app=await api("/app"); bootId=app.boot_id;
        let saved=null;
        try { saved=JSON.parse(sessionStorage.getItem(STORAGE)||"null"); } catch(_) {}
        if(saved?.boot===bootId && saved.session) {
            sessionId=saved.session;
            await refresh();
        } else {
            try { sessionStorage.removeItem(STORAGE); } catch(_) {}
        }
        initialized=true;
        say(sessionId?"Current session restored.":"Ready for a fresh scanning session.");
    } catch(error) {
        say("Could not connect. Refresh the page to retry.\n"+error.message,true);
    }
    renderBar();
}
initialize();
setInterval(refresh,2500);
</script>
<!-- review-export-v11 -->
</body>
</html>
